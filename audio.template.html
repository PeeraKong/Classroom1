<!-- ============================================================
     เครื่องเล่นเสียงบรรยายประจำบท · แปะต่อท้าย index.html ของแต่ละวิชา
     ต้องประกาศ window.CLASSROOM_NARRATION ไว้ก่อนบล็อกนี้ รูปแบบ
       { "<id ของแท็บ>": { t:"ชื่อบท", c:[ {h:"หัวข้อ", s:"<id ของ section>", t:["ประโยค", ...]} ] } }
     ถ้ามีบล็อก JSON id="cn-audio" ชี้ไปยังไฟล์ mp3 ที่สร้างด้วย tools/make-audio.py จะเล่นไฟล์นั้น
     ถ้าไม่มี จะถอยไปใช้เสียงสังเคราะห์ของระบบผ่าน Web Speech API ซึ่งไม่ต้องมีไฟล์และไม่ต้องต่อเน็ต
     ============================================================ -->
<style>

.au-foot{flex:none; border-top:1px solid var(--rule); background:var(--surface); padding:10px 14px 12px}

.au-b{appearance:none; font:inherit; font-size:.82rem; font-weight:600; cursor:pointer; padding:7px 11px;
  border-radius:4px; border:1px solid var(--rule-strong); background:var(--paper); color:var(--ink-2);
  display:flex; align-items:center; gap:6px}

  border-radius:3px; border:1px solid var(--rule-strong); background:var(--paper); color:var(--ink-3)}
.au-rate button[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.au-opt select{font:inherit; font-size:.75rem; max-width:158px; padding:3px 6px; border-radius:3px;
  border:1px solid var(--rule-strong); background:var(--paper); color:var(--ink-2)}
.au-opt label{display:flex; align-items:center; gap:5px; cursor:pointer}
.au-dl{appearance:none; font:inherit; font-size:.75rem; font-weight:600; cursor:pointer; background:none; border:0;
  color:var(--ink-3); text-decoration:underline; text-underline-offset:3px; padding:0}
.au-dl:hover{color:var(--accent)}
.au-warn{font-size:.78rem; color:var(--ink-3); line-height:1.6; padding:10px 12px; margin-bottom:12px;
  border-left:3px solid var(--accent); background:var(--accent-soft); border-radius:3px}
.au-warn b{color:var(--ink)}
@media (max-width:520px){
  .au-panel{left:9px; right:9px; bottom:9px; width:auto; max-height:calc(100vh - 18px)}
  .au-fab{left:9px; bottom:62px}
}
@media (prefers-reduced-motion:reduce){.au-bar i{transition:none}}
</style>

<script>
(function(){
  "use strict";
  function readJson(id){
    var el = document.getElementById(id);
    if (!el) return null;
    try { return JSON.parse(el.textContent); } catch (e){ return null; }
  }
  var DATA = readJson('cn-data') || window.CLASSROOM_NARRATION;
  if (!DATA || !Object.keys(DATA).length) return;
  // ไฟล์เสียงที่สร้างไว้ล่วงหน้าด้วย tools/make-audio.py ถ้ามีจะใช้แทนเสียงสังเคราะห์ของเบราว์เซอร์
  var CLIPS = readJson('cn-audio') || {};

  var COURSE = (location.pathname.replace(/\/[^\/]*$/, '').split('/').filter(Boolean).pop() || 'course');
  var K = 'classroom-audio-' + COURSE;
  var synth = window.speechSynthesis || null;

  var fab    = document.getElementById('au-fab');
  var panel  = document.getElementById('au-panel');
  var chaps  = document.getElementById('au-chaps');
  var bodyEl = document.getElementById('au-body');
  var titleEl= document.getElementById('au-title');
  var subEl  = document.getElementById('au-sub');
  var posEl  = document.getElementById('au-pos');
  var fillEl = document.getElementById('au-fill');
  var playBt = document.getElementById('au-play');
  var plabel = document.getElementById('au-plabel');
  var icon   = document.getElementById('au-icon');
  var voiceSel = document.getElementById('au-voice');
  var followCb = document.getElementById('au-follow');
  var hintEl   = document.getElementById('au-hint');

  var ICON_PLAY  = 'M7 4l13 8-13 8V4z';
  var ICON_PAUSE = 'M6 4h4v16H6zM14 4h4v16h-4z';

  var keys = Object.keys(DATA);
  var cur = keys[0];      // บทที่กำลังเปิดอยู่ในเครื่องเล่น
  var lines = [];         // ประโยคทั้งหมดของบทปัจจุบัน
  var idx = 0;            // ประโยคที่กำลังอ่าน
  var playing = false;
  var voices = [];
  var rate = 1;
  var pitch = 1;
  var chosenVoice = '';
  var stopping = false;

  /* ---------- จำค่าที่ผู้ใช้ตั้งไว้ ---------- */
  function load(){
    try {
      var raw = localStorage.getItem(K);
      if (!raw) return {};
      return JSON.parse(raw) || {};
    } catch (e){ return {}; }
  }
  function save(){
    try {
      var st = load();
      st.rate = rate; st.pitch = pitch; st.voice = chosenVoice; st.follow = followCb.checked;
      st.at = st.at || {};
      st.at[cur] = idx;
      localStorage.setItem(K, JSON.stringify(st));
    } catch (e){ /* โหมดส่วนตัวหรือปิดการเก็บข้อมูล — ข้ามไป */ }
  }
  var saved = load();
  if (saved.rate) rate = saved.rate;
  if (saved.pitch) pitch = saved.pitch;
  if (saved.voice) chosenVoice = saved.voice;
  if (saved.follow === false) followCb.checked = false;

  /* ---------- แปลงข้อมูลบทเป็นรายการประโยค ---------- */
  function build(key){
    cur = key;
    lines = [];
    var ch = DATA[key];
    (ch.c || []).forEach(function(cue, ci){
      (cue.t || []).forEach(function(txt, li){
        lines.push({ text: txt, sec: cue.s || '', head: li === 0 ? cue.h : '', ci: ci });
      });
    });
    titleEl.textContent = ch.t || 'ฟังสรุปบท';
    clip = clipOf(key);
    if (clip){
      var a = ensureAudio();
      if (a && a.getAttribute('src') !== clip.src){ a.setAttribute('src', clip.src); a.load(); }
    } else if (audioEl){
      audioEl.pause();
    }
    render();
    showEngine();
    var st = load();
    idx = (st.at && typeof st.at[key] === 'number' && st.at[key] < lines.length) ? st.at[key] : 0;
    mark();
  }

  function render(){
    bodyEl.innerHTML = '';
    bodyEl.appendChild(hintEl);
    if (!synth){
      var w = document.createElement('div');
      w.className = 'au-warn';
      w.innerHTML = '<b>เบราว์เซอร์นี้ไม่รองรับเสียงอ่าน</b><br>อ่านบทบรรยายด้านล่างได้ตามปกติ หรือกดดาวน์โหลดบทบรรยายไปเปิดในแอปอ่านออกเสียงอื่น';
      bodyEl.appendChild(w);
    }
    var cueEl = null, lastCi = -1;
    lines.forEach(function(l, i){
      if (l.ci !== lastCi){
        lastCi = l.ci;
        cueEl = document.createElement('div');
        cueEl.className = 'au-cue';
        var h = document.createElement('button');
        h.type = 'button'; h.className = 'au-ch';
        h.innerHTML = '<span>' + (l.ci + 1) + '</span><b>' + esc(l.head || '') + '</b>';
        h.addEventListener('click', function(){ jump(i); });
        cueEl.appendChild(h);
        bodyEl.appendChild(cueEl);
      }
      var p = document.createElement('div');
      p.className = 'au-line';
      p.dataset.i = String(i);
      p.textContent = l.text;
      p.addEventListener('click', function(){ jump(i); });
      cueEl.appendChild(p);
    });
  }
  function esc(t){
    return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function mark(){
    var all = bodyEl.querySelectorAll('.au-line');
    for (var i = 0; i < all.length; i++){
      all[i].classList.toggle('now', i === idx);
      all[i].classList.toggle('done', i < idx);
    }
    posEl.textContent = (lines.length ? idx + 1 : 0) + ' / ' + lines.length;
    fillEl.style.width = lines.length ? ((idx / lines.length) * 100) + '%' : '0';
    var el = all[idx];
    if (el && panel.hidden === false){
      var top = el.offsetTop - bodyEl.clientHeight / 2 + el.offsetHeight;
      bodyEl.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
    }
  }

  /* ---------- เลื่อนหน้าเว็บตามหัวข้อที่กำลังอ่าน ---------- */
  var lastSec = '';
  function follow(){
    if (!followCb.checked) return;
    var sec = lines[idx] && lines[idx].sec;
    if (!sec || sec === lastSec) return;
    var el = document.getElementById(sec);
    if (!el) return;
    lastSec = sec;
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ---------- เสียง ----------
     เสียงไทยที่มีอยู่จริงในตลาดตอนนี้ เสียงชายมีน้อยมาก
     ที่พบคือ Niwat ของ Microsoft ซึ่งเป็นเสียง neural และมักโผล่ใน Edge
     ส่วน Kanya ของ Apple กับ Premwadee, Achara และ Google ไทย เป็นเสียงหญิง
     จึงจัดอันดับให้เสียงชายและเสียงแบบ neural ขึ้นก่อน แล้วเลือกให้อัตโนมัติ */
  var MALE_TH = /niwat|ni̇wat|male/i;
  var NEURAL  = /natural|neural|online|enhanced|premium|siri/i;
  function voiceSex(v){
    if (MALE_TH.test(v.name)) return 'ชาย';
    if (/kanya|premwadee|achara|narisa|google/i.test(v.name)) return 'หญิง';
    return '';
  }
  function voiceScore(v){
    return (MALE_TH.test(v.name) ? 100 : 0) + (NEURAL.test(v.name) ? 40 : 0);
  }
  function loadVoices(){
    if (!synth) return;
    voices = synth.getVoices() || [];
    var th = voices.filter(function(v){ return /^th/i.test(v.lang); });
    var list = (th.length ? th : voices).slice();
    list.sort(function(a, b){ return voiceScore(b) - voiceScore(a); });
    voiceSel.innerHTML = '';
    if (!list.length){
      var o = document.createElement('option');
      o.value = ''; o.textContent = 'เสียงเริ่มต้นของระบบ';
      voiceSel.appendChild(o);
      return;
    }
    list.forEach(function(v){
      var tag = [];
      var sex = voiceSex(v);
      if (sex) tag.push(sex);
      if (NEURAL.test(v.name)) tag.push('ธรรมชาติ');
      if (!th.length) tag.push(v.lang);
      var o = document.createElement('option');
      o.value = v.name;
      o.textContent = v.name.replace(/\s*\(Thailand\)|Microsoft\s|\sOnline/gi, '').trim() +
                      (tag.length ? ' · ' + tag.join(' ') : '');
      voiceSel.appendChild(o);
    });
    if (chosenVoice && list.some(function(v){ return v.name === chosenVoice; })) voiceSel.value = chosenVoice;
    else chosenVoice = voiceSel.value;   // ตัวแรกคือตัวที่คะแนนดีที่สุด
    var picked = list.filter(function(v){ return v.name === chosenVoice; })[0];
    if (!th.length){
      hintEl.innerHTML = '<b>ไม่พบเสียงภาษาไทยในเครื่องนี้</b> คำอ่านจะเพี้ยน — บน macOS ติดตั้งได้ที่ System Settings แล้วไปที่ Accessibility เลือก Spoken Content เลือก System Voice แล้วกด Manage Voices เพื่อโหลดเสียงไทย';
      hintEl.hidden = false;
    } else if (picked && !MALE_TH.test(picked.name)){
      hintEl.innerHTML = '<b>เครื่องนี้มีแต่เสียงไทยผู้หญิง</b> ถ้าอยากได้เสียงผู้ชาย ให้เปิดหน้านี้ด้วย <b>Microsoft Edge</b> ซึ่งมีเสียง <b>Niwat</b> เป็นเสียงชายแบบธรรมชาติ · หรือกดปุ่ม <b>ทุ้ม</b> เพื่อลดระดับเสียงลงก็ช่วยได้บ้าง';
      hintEl.hidden = false;
    } else {
      hintEl.hidden = true;
    }
  }
  if (synth && typeof synth.onvoiceschanged !== 'undefined'){
    synth.onvoiceschanged = function(){ if (!clip) loadVoices(); };
  }
  voiceSel.addEventListener('change', function(){
    chosenVoice = voiceSel.value; save();
    if (playing){ restartCurrent(); }
  });

  /* ---------- เล่น ---------- */
  var keepAlive = null, gapTimer = null;
  function speakCurrent(){
    if (!synth || idx >= lines.length){ stop(); return; }
    var u = new SpeechSynthesisUtterance(lines[idx].text);
    u.lang = 'th-TH';
    u.rate = rate;
    u.pitch = pitch;
    if (chosenVoice){
      var v = voices.filter(function(x){ return x.name === chosenVoice; })[0];
      if (v){ u.voice = v; u.lang = v.lang; }
    }
    u.onend = function(){
      if (stopping) return;
      idx++;
      save();
      if (idx >= lines.length){ finish(); return; }
      mark(); follow();
      // เว้นจังหวะหายใจระหว่างย่อหน้า และเว้นนานขึ้นเมื่อขึ้นหัวข้อใหม่ ให้ฟังเป็นธรรมชาติ
      var gap = lines[idx].head ? 750 : 330;
      if (gapTimer) clearTimeout(gapTimer);
      gapTimer = setTimeout(function(){ if (playing) speakCurrent(); }, gap / Math.max(rate, .5));
    };
    u.onerror = function(e){
      // interrupted / canceled เกิดจากการกดหยุดเอง ไม่ต้องแจ้ง
      if (stopping || !e || e.error === 'interrupted' || e.error === 'canceled') return;
      setUi(false);
    };
    synth.speak(u);
  }
  function clearGap(){ if (gapTimer){ clearTimeout(gapTimer); gapTimer = null; } }
  function restartCurrent(){
    clearGap();
    stopping = true; synth.cancel(); stopping = false;
    setTimeout(function(){ if (playing) speakCurrent(); }, 60);
  }
  function setUi(on){
    playing = on;
    plabel.textContent = on ? 'หยุดชั่วคราว' : 'เล่น';
    icon.firstChild.setAttribute('d', on ? ICON_PAUSE : ICON_PLAY);
    fab.classList.toggle('on', on);
    if (on && !clip){
      // Chrome หยุดสังเคราะห์เสียงเองเมื่อเล่นต่อเนื่องนาน จึงต้องปลุกเป็นระยะ
      if (keepAlive) clearInterval(keepAlive);
      keepAlive = setInterval(function(){
        if (!playing || !synth) return;
        if (synth.speaking && !synth.paused){ synth.pause(); synth.resume(); }
      }, 9000);
    } else if (keepAlive){
      clearInterval(keepAlive); keepAlive = null;
    }
  }
  /* ---------- โหมดไฟล์เสียงจริง ----------
     ถ้ามีไฟล์ที่สร้างไว้ด้วย tools/make-audio.py จะเล่นไฟล์นั้นแทนเสียงสังเคราะห์
     เพราะได้เสียงผู้ชายแบบ neural ซึ่งฟังเป็นธรรมชาติกว่ามาก */
  var audioEl = null, clip = null;
  function clipOf(key){
    var c = CLIPS[key];
    if (!c || !c.src || !c.cues) return null;
    var n = 0;
    (DATA[key].c || []).forEach(function(q){ n += (q.t || []).length; });
    return c.cues.length === n ? c : null;   // ไฟล์เสียงต้องตรงกับบทบรรยายรุ่นปัจจุบัน
  }
  function ensureAudio(){
    if (audioEl) return audioEl;
    audioEl = document.createElement('audio');
    audioEl.preload = 'metadata';
    audioEl.hidden = true;
    // ต่อเข้าเอกสารจริง เพื่อให้เบราว์เซอร์จัดการเสียงพื้นหลังและปุ่มบนหน้าจอล็อกได้ถูกต้อง
    panel.appendChild(audioEl);
    audioEl.addEventListener('timeupdate', function(){
      if (!playing || !clip) return;
      var t = audioEl.currentTime, j = idx;
      while (j + 1 < clip.cues.length && t >= clip.cues[j + 1]) j++;
      while (j > 0 && t < clip.cues[j]) j--;
      if (j !== idx){ idx = j; mark(); follow(); save(); }
    });
    audioEl.addEventListener('ended', function(){ finish(); });
    audioEl.addEventListener('error', function(){
      // หาไฟล์ไม่เจอหรือเล่นไม่ได้ ให้ถอยไปใช้เสียงสังเคราะห์แทน
      clip = null; audioEl = null;
      setUi(false); showEngine();
    });
    return audioEl;
  }
  function mmss(sec){
    sec = Math.max(0, Math.round(sec || 0));
    return Math.floor(sec / 60) + ':' + ('0' + (sec % 60)).slice(-2);
  }
  function showEngine(){
    var onClip = !!clip;
    // ปุ่มเลือกเสียงกับระดับเสียงใช้ได้เฉพาะโหมดเสียงสังเคราะห์
    voiceSel.disabled = onClip;
    Array.prototype.forEach.call(document.querySelectorAll('.au-rate button[data-pitch]'), function(b){
      b.disabled = onClip;
    });
    if (onClip){
      subEl.textContent = lines.length + ' ย่อหน้า · ' + mmss(clip.dur) + ' นาที · ' + (clip.voice || 'ไฟล์เสียง');
      hintEl.hidden = true;
    } else {
      var words = lines.reduce(function(n, l){ return n + l.text.length; }, 0);
      subEl.textContent = lines.length + ' ย่อหน้า · ประมาณ ' + Math.max(1, Math.round(words / 800)) + ' นาที';
      loadVoices();
    }
  }

  function play(){
    if (!lines.length) return;
    if (idx >= lines.length) idx = 0;
    setUi(true); mark(); follow();
    clearGap();
    if (clip){
      var a = ensureAudio();
      if (!a) return;
      a.playbackRate = rate;
      if (Math.abs(a.currentTime - clip.cues[idx]) > 0.4) a.currentTime = clip.cues[idx];
      var pr = a.play();
      if (pr && pr.catch) pr.catch(function(){ setUi(false); });
      return;
    }
    if (!synth){ setUi(false); return; }
    stopping = true; synth.cancel(); stopping = false;
    setTimeout(speakCurrent, 60);
  }
  function pause(){
    clearGap();
    if (clip && audioEl){ audioEl.pause(); setUi(false); return; }
    if (!synth) return;
    stopping = true; synth.cancel(); stopping = false;
    setUi(false);
  }
  function stop(){
    clearGap();
    if (clip && audioEl){ audioEl.pause(); }
    if (synth){ stopping = true; synth.cancel(); stopping = false; }
    setUi(false);
  }
  function finish(){
    setUi(false);
    idx = lines.length ? lines.length - 1 : 0;
    mark(); save();
  }
  function jump(i){
    idx = Math.max(0, Math.min(i, lines.length - 1));
    mark(); follow(); save();
    if (clip){
      var a = ensureAudio();
      if (a) a.currentTime = clip.cues[idx];
      return;
    }
    if (playing) restartCurrent();
  }

  playBt.addEventListener('click', function(){ playing ? pause() : play(); });
  document.getElementById('au-prev').addEventListener('click', function(){ jump(idx - 1); });
  document.getElementById('au-next').addEventListener('click', function(){ jump(idx + 1); });
  document.getElementById('au-stop').addEventListener('click', function(){ stop(); jump(0); });
  followCb.addEventListener('change', save);

  Array.prototype.forEach.call(document.querySelectorAll('.au-rate button[data-pitch]'), function(b){
    b.setAttribute('aria-pressed', String(parseFloat(b.dataset.pitch) === pitch));
    b.addEventListener('click', function(){
      pitch = parseFloat(b.dataset.pitch);
      Array.prototype.forEach.call(document.querySelectorAll('.au-rate button[data-pitch]'), function(x){
        x.setAttribute('aria-pressed', String(x === b));
      });
      save();
      if (playing) restartCurrent();
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll('.au-rate button[data-rate]'), function(b){
    b.setAttribute('aria-pressed', String(parseFloat(b.dataset.rate) === rate));
    b.addEventListener('click', function(){
      rate = parseFloat(b.dataset.rate);
      Array.prototype.forEach.call(document.querySelectorAll('.au-rate button[data-rate]'), function(x){
        x.setAttribute('aria-pressed', String(x === b));
      });
      save();
      if (clip && audioEl){ audioEl.playbackRate = rate; }
      else if (playing) restartCurrent();
    });
  });

  /* ---------- เลือกบท · ผูกกับแท็บของหน้า ---------- */
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  function tabFor(key){
    return tabs.filter(function(t){ return t.getAttribute('aria-controls') === key; })[0] || null;
  }
  keys.forEach(function(k){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'au-chap'; b.dataset.k = k;
    b.textContent = DATA[k].s || DATA[k].t;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function(){
      if (k === cur) return;
      stop();
      var t = tabFor(k);
      if (t) t.click();
      pick(k);
    });
    chaps.appendChild(b);
  });
  function pick(k){
    if (!DATA[k]) return;
    build(k);
    lastSec = '';
    Array.prototype.forEach.call(chaps.children, function(b){
      b.setAttribute('aria-pressed', String(b.dataset.k === k));
    });
  }
  // เปลี่ยนแท็บของหน้าแล้วให้เครื่องเล่นตามไปด้วย ถ้ายังไม่ได้กดเล่น
  tabs.forEach(function(t){
    t.addEventListener('click', function(){
      var k = t.getAttribute('aria-controls');
      if (playing || !DATA[k] || k === cur) return;
      pick(k);
    });
  });

  /* ---------- ดาวน์โหลดบทบรรยาย ---------- */
  document.getElementById('au-dl').addEventListener('click', function(){
    var ch = DATA[cur];
    var out = [ch.t, ''];
    (ch.c || []).forEach(function(cue, i){
      out.push((i + 1) + '. ' + cue.h);
      (cue.t || []).forEach(function(x){ out.push('   ' + x); });
      out.push('');
    });
    var blob = new Blob([out.join('\n')], {type:'text/plain;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'narration-' + COURSE + '-' + cur + '.txt';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  });

  /* ---------- เปิดปิดแผง ---------- */
  function open(){
    panel.hidden = false; fab.hidden = true;
    mark();
  }
  function close(){
    panel.hidden = true; fab.hidden = false;
  }
  fab.addEventListener('click', open);
  document.getElementById('au-close').addEventListener('click', function(){ stop(); close(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !panel.hidden){ stop(); close(); }
  });
  window.addEventListener('beforeunload', function(){
    if (synth) synth.cancel();
    if (audioEl) audioEl.pause();
  });

  /* ---------- เริ่มต้น ---------- */
  var open0 = null;
  tabs.forEach(function(t){
    if (t.getAttribute('aria-selected') === 'true') open0 = t.getAttribute('aria-controls');
  });
  pick(DATA[open0] ? open0 : keys[0]);
  fab.hidden = false;
})();
</script>
