<!--
  ผู้ช่วยตอบคำถามประจำวิชา — แม่แบบสำหรับแปะท้ายหน้าเว็บของแต่ละวิชา

  วิธีใช้กับวิชาใหม่
  1. คัดลอกทั้งไฟล์นี้ไปวางไว้ก่อนบรรทัดสุดท้ายของ index.html ของวิชานั้น
  2. แก้ __SUBJECT__ ให้ตรงกับคีย์ใน SUBJECTS ของ chat-worker/src/index.js
  3. แก้ __LABEL__ เป็นชื่อวิชาที่จะแสดงบนหัวกล่องแชท
  4. ใส่ URL ของ Worker ลงในตัวแปร ENDPOINT
-->
<style>
.ai-fab{position:fixed; right:18px; bottom:18px; z-index:200; display:flex; align-items:center; gap:8px;
  font:inherit; font-size:.86rem; font-weight:600; cursor:pointer; padding:11px 17px; border-radius:99px;
  border:1px solid var(--accent); background:var(--accent); color:var(--paper); box-shadow:var(--shadow)}
.ai-fab:hover{filter:brightness(1.08)}
.ai-fab svg{width:15px; height:15px; flex:none}
.ai-panel{position:fixed; right:18px; bottom:18px; z-index:201; width:min(430px, calc(100vw - 36px));
  height:min(620px, calc(100vh - 36px)); display:flex; flex-direction:column; border:1px solid var(--rule);
  border-radius:8px; background:var(--paper); box-shadow:0 18px 60px -20px rgba(0,0,0,.45); overflow:hidden}
.ai-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 15px;
  border-bottom:1px solid var(--rule); background:var(--surface); flex:none}
.ai-title{font-family:"Noto Serif Thai",Georgia,serif; font-weight:700; font-size:.95rem}
.ai-sub{font-family:"IBM Plex Mono",monospace; font-size:.66rem; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-3); margin-top:2px}
.ai-x{appearance:none; border:0; background:none; cursor:pointer; color:var(--ink-3); font-size:1.35rem;
  line-height:1; padding:2px 6px; border-radius:4px}
.ai-x:hover{color:var(--ink); background:var(--surface-2)}
.ai-log{flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:12px}
.ai-msg{font-size:.88rem; line-height:1.68; white-space:pre-wrap; overflow-wrap:anywhere}
.ai-msg.me{align-self:flex-end; max-width:85%; background:var(--accent-soft); color:var(--ink);
  padding:9px 13px; border-radius:12px 12px 3px 12px}
.ai-msg.ai{align-self:flex-start; max-width:95%; color:var(--ink-2)}
.ai-msg.ai strong{color:var(--ink); font-weight:600}
.ai-msg.sys{align-self:stretch; font-size:.82rem; color:var(--ink-2); border-left:3px solid var(--accent);
  background:var(--accent-soft); padding:9px 12px; border-radius:0 4px 4px 0; white-space:normal}
.ai-hint{font-size:.82rem; color:var(--ink-3); line-height:1.6}
.ai-hint b{color:var(--ink-2)}
.ai-dots{display:inline-flex; gap:4px; align-items:center; height:1.4em}
.ai-dots i{width:5px; height:5px; border-radius:50%; background:var(--ink-3); animation:aiblink 1.2s infinite}
.ai-dots i:nth-child(2){animation-delay:.2s}
.ai-dots i:nth-child(3){animation-delay:.4s}
@keyframes aiblink{0%,60%,100%{opacity:.25}30%{opacity:1}}
.ai-foot{flex:none; border-top:1px solid var(--rule); padding:10px 12px; background:var(--surface)}
.ai-row{display:flex; gap:8px; align-items:flex-end}
.ai-in{flex:1; resize:none; font:inherit; font-size:.87rem; line-height:1.5; max-height:120px; padding:8px 10px;
  border:1px solid var(--rule-strong); border-radius:6px; background:var(--paper); color:var(--ink)}
.ai-in:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent)}
.ai-send{appearance:none; font:inherit; font-size:.84rem; font-weight:600; cursor:pointer; padding:9px 15px;
  border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:var(--paper); flex:none}
.ai-send:disabled{opacity:.45; cursor:not-allowed}
.ai-note{font-size:.7rem; color:var(--ink-3); margin-top:7px; line-height:1.45}
@media (prefers-reduced-motion:reduce){.ai-dots i{animation:none; opacity:.6}}
</style>
<script>
(function(){
  "use strict";

  // =====================================================================
  //  ตั้งค่าตรงนี้ — วาง URL ของ Cloudflare Worker ที่ deploy แล้ว
  //  ปล่อยว่างไว้ = ไม่แสดงปุ่มแชทเลย และหน้าเว็บทำงานปกติทุกอย่าง
  //  ตัวอย่าง "https://classroom-chat.ชื่อบัญชี.workers.dev/chat"
  // =====================================================================
  var ENDPOINT = "";
  var SUBJECT  = "__SUBJECT__";
  var LABEL    = "__LABEL__";

  if (!ENDPOINT) return;

  var LS_ID = "classroom-client-id", LS_CODE = "classroom-access-code";
  var clientId = localStorage.getItem(LS_ID);
  if (!clientId) {
    clientId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
    localStorage.setItem(LS_ID, clientId);
  }

  var ERRORS = {
    quota_exceeded: "ใช้ครบโควตาของวันนี้แล้ว พรุ่งนี้กลับมาถามใหม่ได้",
    bad_access_code: "รหัสเข้าใช้ไม่ถูกต้อง สอบถามอาจารย์ผู้สอนอีกครั้ง",
    origin_not_allowed: "หน้านี้ไม่ได้รับอนุญาตให้เรียกผู้ช่วย",
    upstream_rate_limited: "ตอนนี้มีคนใช้พร้อมกันเยอะ รอสักครู่แล้วลองใหม่",
    upstream_unreachable: "ติดต่อผู้ช่วยไม่ได้ ลองใหม่อีกครั้ง",
    upstream_forbidden: "บัญชีผู้ให้บริการปฏิเสธคำขอ แจ้งผู้ดูแลได้เลย",
    bad_api_key: "การตั้งค่าฝั่งเซิร์ฟเวอร์ยังไม่ถูกต้อง แจ้งผู้ดูแลได้เลย",
    server_not_configured: "เซิร์ฟเวอร์ยังไม่ได้ตั้งค่า API key",
    bad_messages: "ข้อความไม่ถูกต้อง ลองพิมพ์ใหม่",
    bad_request: "คำขอไม่ถูกต้อง ลองเริ่มบทสนทนาใหม่",
    _default: "เกิดข้อผิดพลาด ลองใหม่อีกครั้ง"
  };

  var fab = document.createElement("button");
  fab.type = "button"; fab.className = "ai-fab";
  fab.setAttribute("aria-label", "เปิดผู้ช่วยตอบคำถาม");
  fab.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.3-.6L3 21l1.8-5A8.3 8.3 0 0 1 4 11.5a8.4 8.4 0 0 1 9-8.4 8.4 8.4 0 0 1 8 8.4z"/>' +
    '</svg>ถามผู้ช่วย';
  document.body.appendChild(fab);

  var panel = null, log = null, input = null, sendBtn = null;
  var history = [], busy = false;

  function esc(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  // ทำตัวหนาให้อ่านง่ายขึ้น — escape ก่อนเสมอ จึงปลอดภัยจากการฉีดโค้ด
  function fmt(s){
    return esc(s).replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  }

  function bubble(cls, text){
    var d = document.createElement("div");
    d.className = "ai-msg " + cls;
    if (cls === "ai") d.innerHTML = fmt(text); else d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  function onEsc(e){ if (e.key === "Escape" && panel) close(); }

  function close(){
    if (!panel) return;
    document.removeEventListener("keydown", onEsc);
    panel.remove(); panel = null;
    fab.style.display = "";
    fab.focus();
  }

  function open(){
    if (panel) return;
    panel = document.createElement("div");
    panel.className = "ai-panel";
    panel.setAttribute("role", "dialog");
    panel.setAttribute("aria-label", "ผู้ช่วยตอบคำถามวิชา " + LABEL);
    panel.innerHTML =
      '<div class="ai-head"><div><div class="ai-title">ผู้ช่วยตอบคำถาม</div>' +
      '<div class="ai-sub">' + esc(LABEL) + '</div></div>' +
      '<button type="button" class="ai-x" aria-label="ปิด">&times;</button></div>' +
      '<div class="ai-log" aria-live="polite"></div>' +
      '<div class="ai-foot"><div class="ai-row">' +
      '<textarea class="ai-in" rows="1" placeholder="พิมพ์คำถามเกี่ยวกับวิชานี้..."></textarea>' +
      '<button type="button" class="ai-send">ส่ง</button></div>' +
      '<div class="ai-note">ผู้ช่วยอาจตอบผิดได้ ตรวจกับเอกสารประกอบการสอนเสมอ</div></div>';
    document.body.appendChild(panel);
    fab.style.display = "none";

    log = panel.querySelector(".ai-log");
    input = panel.querySelector(".ai-in");
    sendBtn = panel.querySelector(".ai-send");

    if (history.length === 0) {
      var hint = document.createElement("div");
      hint.className = "ai-hint";
      hint.innerHTML = "__HINT__";
      log.appendChild(hint);
    } else {
      history.forEach(function(m){ bubble(m.role === "user" ? "me" : "ai", m.content); });
    }

    panel.querySelector(".ai-x").addEventListener("click", close);
    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", function(e){
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
    input.addEventListener("input", function(){
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
    });
    document.addEventListener("keydown", onEsc);
    input.focus();
  }

  async function send(){
    if (busy) return;
    var text = input.value.trim();
    if (!text) return;

    var hint = log.querySelector(".ai-hint");
    if (hint) hint.remove();

    input.value = ""; input.style.height = "auto";
    bubble("me", text);
    history.push({ role: "user", content: text });

    busy = true; sendBtn.disabled = true;
    var out = bubble("ai", "");
    out.innerHTML = '<span class="ai-dots"><i></i><i></i><i></i></span>';
    var acc = "", started = false;

    function fail(code){
      out.className = "ai-msg sys";
      out.textContent = ERRORS[code] || ERRORS._default;
      history.pop();
    }

    try {
      var res = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          subject: SUBJECT,
          clientId: clientId,
          accessCode: localStorage.getItem(LS_CODE) || undefined,
          messages: history
        })
      });

      if (!res.ok) {
        var info = {};
        try { info = await res.json(); } catch (e) {}
        fail(info.error);
        return;
      }

      var reader = res.body.getReader(), dec = new TextDecoder(), buf = "";
      while (true) {
        var chunk = await reader.read();
        if (chunk.done) break;
        buf += dec.decode(chunk.value, { stream: true });
        var parts = buf.split("\n\n");
        buf = parts.pop();
        for (var i = 0; i < parts.length; i++) {
          var line = parts[i].trim();
          if (line.indexOf("data: ") !== 0) continue;
          var ev;
          try { ev = JSON.parse(line.slice(6)); } catch (e) { continue; }
          if (ev.error) { fail(ev.error); return; }
          if (ev.text) {
            if (!started) { out.innerHTML = ""; started = true; }
            acc += ev.text;
            out.innerHTML = fmt(acc);
            log.scrollTop = log.scrollHeight;
          }
        }
      }

      if (acc) history.push({ role: "assistant", content: acc });
      else fail("_default");
    } catch (e) {
      // ในหน้าพรีวิวของ Artifact การเรียกออกนอกโดเมนถูกบล็อกไว้ จึงมาลงตรงนี้
      out.className = "ai-msg sys";
      out.textContent = "เรียกผู้ช่วยไม่สำเร็จ — ฟีเจอร์นี้ใช้ได้เฉพาะบนเว็บไซต์จริง ไม่ทำงานในหน้าพรีวิว";
      history.pop();
    } finally {
      busy = false;
      if (sendBtn) sendBtn.disabled = false;
      if (input) input.focus();
    }
  }

  fab.addEventListener("click", open);
})();
</script>
