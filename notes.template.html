<!--
  โน้ต · เขียนด้วยมือ · กระดาษทด — บล็อกเสริมที่แปะท้ายหน้าเว็บของแต่ละวิชา
  ทำงานด้วยตัวเองทั้งหมด ไม่ต้องแก้ HTML เดิม ปุ่มถูกแทรกเข้าหัวข้อด้วย JS
  เก็บข้อมูลไว้ใน localStorage ของเบราว์เซอร์เครื่องนั้น ไม่ได้ส่งออกไปไหน
-->
<style>
/* ---------- ปุ่มจดโน้ตในหัวข้อ ---------- */
.nt-add{appearance:none; font:inherit; font-size:.72rem; font-weight:600; cursor:pointer;
  padding:2px 9px; margin-left:auto; border-radius:99px; white-space:nowrap; align-self:center;
  border:1px solid var(--rule-strong); background:var(--paper); color:var(--ink-3); line-height:1.6}
.nt-add:hover{border-color:var(--accent); color:var(--accent)}
.nt-add[data-has="1"]{border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}

/* ---------- กล่องโน้ตใต้หัวข้อ ---------- */
.nt-box{margin:14px 0 4px; border:1px dashed var(--rule-strong); border-radius:4px;
  background:var(--surface); padding:10px 12px}
.nt-box[hidden]{display:none}
.nt-tabs{display:flex; gap:4px; margin-bottom:9px}
.nt-tab{appearance:none; font:inherit; font-size:.76rem; font-weight:600; cursor:pointer; padding:4px 12px;
  border:1px solid transparent; border-radius:99px; background:none; color:var(--ink-3)}
.nt-tab:hover{color:var(--ink)}
.nt-tab[aria-selected="true"]{background:var(--accent-soft); color:var(--accent)}
.nt-tab .dot{display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--accent);
  margin-left:5px; vertical-align:middle}
.nt-pane[hidden]{display:none}
.nt-box textarea{display:block; width:100%; min-height:70px; resize:vertical; font:inherit;
  font-size:.88rem; line-height:1.7; padding:8px 10px; border:1px solid var(--rule);
  border-radius:3px; background:var(--paper); color:var(--ink)}
.nt-box textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent)}
.nt-foot{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:7px}
.nt-hint{font-size:.72rem; color:var(--ink-3)}
.nt-del{appearance:none; font:inherit; font-size:.72rem; cursor:pointer; padding:2px 8px;
  border:1px solid var(--rule-strong); border-radius:3px; background:var(--paper); color:var(--ink-3)}
.nt-del:hover{border-color:var(--accent); color:var(--accent)}

/* ---------- แผ่นเขียนด้วยมือ ----------
   พื้นเป็นกระดาษสีอ่อนเสมอทั้งธีมสว่างและมืด เพราะหมึกที่เขียนไว้เป็นสีเข้มตายตัว
   ถ้าให้พื้นเปลี่ยนตามธีม ลายมือที่เขียนไว้ตอนธีมหนึ่งจะมองไม่เห็นในอีกธีมหนึ่ง */
.dw{border:1px solid var(--rule-strong); border-radius:4px; overflow:hidden; background:#fdfdfb}
.dw-bar{display:flex; gap:5px; align-items:center; flex-wrap:wrap; padding:6px 8px;
  border-bottom:1px solid var(--rule); background:var(--surface-2)}
.dw-t{appearance:none; font:inherit; font-size:.74rem; font-weight:600; cursor:pointer; padding:4px 9px;
  border:1px solid var(--rule-strong); border-radius:3px; background:var(--paper); color:var(--ink-2); line-height:1.5}
.dw-t:hover{border-color:var(--accent); color:var(--accent)}
.dw-t[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--paper)}
.dw-c{width:22px; height:22px; padding:0; border-radius:50%; border:2px solid var(--rule-strong); cursor:pointer}
.dw-c[aria-pressed="true"]{outline:2px solid var(--accent); outline-offset:2px; border-color:var(--paper)}
.dw-w{appearance:none; cursor:pointer; padding:4px 7px; border:1px solid var(--rule-strong);
  border-radius:3px; background:var(--paper); display:flex; align-items:center; gap:0}
.dw-w[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.dw-w i{display:block; background:var(--ink-2); border-radius:99px}
.dw-sp{margin-left:auto; display:flex; gap:5px}
.dw-canvas{display:block; width:100%; height:auto; touch-action:none; cursor:crosshair}
.dw-canvas.era{cursor:cell}
.dw-tip{font-size:.71rem; color:var(--ink-3); padding:5px 9px; border-top:1px solid var(--rule);
  background:var(--surface); line-height:1.5}

/* ---------- ปุ่มลอยเปิดกระดาษทด ---------- */
.pad-fab{position:fixed; left:18px; bottom:18px; z-index:200; display:flex; align-items:center; gap:8px;
  font:inherit; font-size:.86rem; font-weight:600; cursor:pointer; padding:11px 17px; border-radius:99px;
  border:1px solid var(--rule-strong); background:var(--paper); color:var(--ink-2); box-shadow:var(--shadow)}
.pad-fab:hover{border-color:var(--accent); color:var(--accent)}
.pad-fab svg{width:15px; height:15px; flex:none}
.pad-fab .pad-dot{width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none}

/* ---------- แผงกระดาษทด ---------- */
.pad{position:fixed; left:18px; bottom:18px; z-index:201; width:min(560px, calc(100vw - 36px));
  height:min(680px, calc(100vh - 36px)); display:flex; flex-direction:column; border:1px solid var(--rule);
  border-radius:8px; background:var(--paper); box-shadow:0 18px 60px -20px rgba(0,0,0,.45); overflow:hidden}
.pad.wide{width:min(860px, calc(100vw - 36px))}
.pad-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 14px;
  border-bottom:1px solid var(--rule); background:var(--surface); flex:none}
.pad-tabs{display:flex; gap:4px; flex-wrap:wrap}
.pad-tab{appearance:none; font:inherit; font-size:.82rem; font-weight:600; cursor:pointer; padding:5px 11px;
  border:1px solid transparent; border-radius:99px; background:none; color:var(--ink-3)}
.pad-tab:hover{color:var(--ink)}
.pad-tab[aria-selected="true"]{background:var(--accent-soft); color:var(--accent)}
.pad-x{appearance:none; border:0; background:none; cursor:pointer; color:var(--ink-3); font-size:1.35rem;
  line-height:1; padding:2px 6px; border-radius:4px}
.pad-x:hover{color:var(--ink); background:var(--surface-2)}
.pad-body{flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:10px}
.pad-body[hidden]{display:none}
.pad-in{width:100%; flex:none; min-height:150px; resize:vertical; font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:.86rem; line-height:1.75; font-variant-numeric:tabular-nums; padding:9px 11px;
  border:1px solid var(--rule-strong); border-radius:4px; background:var(--surface); color:var(--ink)}
.pad-in:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent)}
.pad-res{display:flex; flex-direction:column; gap:2px}
.pad-row{display:flex; justify-content:space-between; gap:14px; font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:.8rem; font-variant-numeric:tabular-nums; padding:3px 0; border-bottom:1px solid var(--rule)}
.pad-row .src{color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
.pad-row .val{color:var(--accent); font-weight:600; flex:none}
.pad-row.sum{border-bottom:0; border-top:1px solid var(--rule-strong); margin-top:4px; padding-top:7px}
.pad-row.sum .src{color:var(--ink-2); font-family:"IBM Plex Sans Thai",sans-serif}
.pad-row.sum .val{color:var(--ink)}
.pad-empty{font-size:.8rem; color:var(--ink-3); line-height:1.7}
.pad-empty code{font-family:"IBM Plex Mono",monospace; background:var(--surface-2); padding:1px 5px; border-radius:3px}

.pad-note{border:1px solid var(--rule); border-radius:4px; background:var(--surface); padding:9px 11px}
.pad-note a{display:block; font-size:.8rem; font-weight:600; color:var(--accent); text-decoration:none; margin-bottom:3px}
.pad-note a:hover{text-decoration:underline}
.pad-note p{font-size:.82rem; color:var(--ink-2); line-height:1.65; white-space:pre-wrap; overflow-wrap:anywhere; margin:0}
.pad-note .tagdraw{font-size:.72rem; color:var(--ink-3)}

.pad-foot{flex:none; border-top:1px solid var(--rule); padding:9px 12px; background:var(--surface);
  display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.pad-act{appearance:none; font:inherit; font-size:.76rem; font-weight:600; cursor:pointer; padding:5px 10px;
  border:1px solid var(--rule-strong); border-radius:3px; background:var(--paper); color:var(--ink-2)}
.pad-act:hover{border-color:var(--accent); color:var(--accent)}
.pad-act.danger:hover{border-color:var(--red, #a3341f); color:var(--red, #a3341f)}
.pad-msg{font-size:.74rem; color:var(--ink-3); margin-left:auto}

@media (max-width:620px){ .pad, .pad.wide{left:10px; right:10px; width:auto} .pad-fab{left:12px; bottom:12px} }

/* ---------- ตอนสั่งพิมพ์ ให้โน้ตและลายมือติดไปด้วย แต่ซ่อนปุ่มและแผง ---------- */
@media print{
  .pad-fab, .pad, .nt-add, .nt-del, .nt-hint, .nt-tabs, .dw-bar, .dw-tip,
  .ai-fab, .ai-panel{display:none !important}
  .nt-box[hidden]{display:block !important}
  .nt-pane[hidden]{display:block !important}
  .nt-box{border-style:solid; break-inside:avoid}
  .nt-box textarea{border:0; padding:0; background:none; min-height:0; height:auto; resize:none}
  .nt-pane.empty{display:none !important}
  .dw{break-inside:avoid}
}
</style>
<script>
(function(){
  "use strict";

  // แยกพื้นที่เก็บของแต่ละวิชาด้วยชื่อโฟลเดอร์
  // จำเป็นเพราะเวลาเปิดไฟล์ตรง ๆ ด้วย file:// เบราว์เซอร์บางตัวใช้ localStorage ร่วมกันทุกไฟล์
  var COURSE = (location.pathname.replace(/\/[^\/]*$/, '').split('/').filter(Boolean).pop() || 'course');
  var K_NOTE = 'classroom-notes-' + COURSE;
  var K_PAD  = 'classroom-scratch-' + COURSE;
  var K_DRAW = 'classroom-draw-' + COURSE;

  var canStore = true, quotaHit = false;
  function get(k, d){ try { var v = localStorage.getItem(k); return v == null ? d : v; } catch(e){ canStore = false; return d; } }
  function set(k, v){
    try { localStorage.setItem(k, v); return true; }
    catch(e){
      // ลายมือกินที่มากกว่าตัวอักษรมาก จึงเป็นตัวที่ชนเพดานก่อนเสมอ
      if (e && (e.name === 'QuotaExceededError' || e.code === 22)) quotaHit = true;
      else canStore = false;
      return false;
    }
  }
  function readJSON(k){ try { return JSON.parse(get(k, '{}')) || {}; } catch(e){ return {}; } }

  var notes = readJSON(K_NOTE);
  var draws = readJSON(K_DRAW);
  function saveNotes(){ return set(K_NOTE, JSON.stringify(notes)); }
  function saveDraws(){ return set(K_DRAW, JSON.stringify(draws)); }

  var INKS = ['#1a1a1a', '#c0392b', '#1f5fa8', '#1f6b4f'];
  var WIDTHS = [2, 4, 7];

  /* =========================================================
     แผ่นเขียนด้วยมือ
     เก็บเป็นเส้น (vector) ไม่ใช่รูปภาพ เพราะไฟล์เล็กกว่ามาก
     และวาดใหม่ได้คมชัดทุกความละเอียดหน้าจอ
     ========================================================= */
  function makePad(key, LW, LH, opts){
    opts = opts || {};
    var wrap = document.createElement('div');
    wrap.className = 'dw';

    var bar = document.createElement('div'); bar.className = 'dw-bar';
    var cv = document.createElement('canvas'); cv.className = 'dw-canvas';
    cv.setAttribute('role', 'img');
    cv.setAttribute('aria-label', opts.label || 'พื้นที่เขียนด้วยมือ');
    var tip = document.createElement('div'); tip.className = 'dw-tip';
    tip.textContent = 'เขียนด้วยปากกา นิ้ว หรือเมาส์ก็ได้ · ถ้าใช้ Apple Pencil ระบบจะไม่รับสัมผัสจากฝ่ามือให้เอง';
    wrap.appendChild(bar); wrap.appendChild(cv); wrap.appendChild(tip);

    var st = draws[key];
    var strokes = (st && Array.isArray(st.s)) ? st.s : [];
    var tool = 'pen', ink = 0, wIdx = 1;
    var penSeen = false, drawing = false, cur = null;

    // --- ปุ่มเครื่องมือ ---
    function mk(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; }
    var bPen = mk('button', 'dw-t', 'ปากกา'); bPen.type = 'button'; bPen.setAttribute('aria-pressed', 'true');
    var bEra = mk('button', 'dw-t', 'ยางลบ'); bEra.type = 'button'; bEra.setAttribute('aria-pressed', 'false');
    bar.appendChild(bPen); bar.appendChild(bEra);

    var colBtns = INKS.map(function(c, i){
      var b = mk('button', 'dw-c'); b.type = 'button'; b.style.background = c;
      b.setAttribute('aria-label', 'สีหมึกที่ ' + (i + 1));
      b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
      b.addEventListener('click', function(){
        ink = i; tool = 'pen';
        colBtns.forEach(function(x, j){ x.setAttribute('aria-pressed', j === i ? 'true' : 'false'); });
        bPen.setAttribute('aria-pressed', 'true'); bEra.setAttribute('aria-pressed', 'false');
        cv.classList.remove('era');
      });
      bar.appendChild(b); return b;
    });

    var wBtns = WIDTHS.map(function(w, i){
      var b = mk('button', 'dw-w'); b.type = 'button';
      b.setAttribute('aria-label', 'ความหนาเส้นระดับ ' + (i + 1));
      b.setAttribute('aria-pressed', i === 1 ? 'true' : 'false');
      var d = mk('i'); d.style.width = (w + 4) + 'px'; d.style.height = Math.max(2, w - 1) + 'px';
      b.appendChild(d);
      b.addEventListener('click', function(){
        wIdx = i;
        wBtns.forEach(function(x, j){ x.setAttribute('aria-pressed', j === i ? 'true' : 'false'); });
      });
      bar.appendChild(b); return b;
    });

    var sp = mk('div', 'dw-sp');
    var bUndo = mk('button', 'dw-t', 'ย้อนกลับ'); bUndo.type = 'button';
    var bClr = mk('button', 'dw-t', 'ล้าง'); bClr.type = 'button';
    var bPng = mk('button', 'dw-t', 'บันทึกรูป'); bPng.type = 'button';
    sp.appendChild(bUndo); sp.appendChild(bClr); sp.appendChild(bPng);
    bar.appendChild(sp);

    bPen.addEventListener('click', function(){
      tool = 'pen'; bPen.setAttribute('aria-pressed', 'true'); bEra.setAttribute('aria-pressed', 'false');
      cv.classList.remove('era');
    });
    bEra.addEventListener('click', function(){
      tool = 'era'; bEra.setAttribute('aria-pressed', 'true'); bPen.setAttribute('aria-pressed', 'false');
      cv.classList.add('era');
    });

    // --- วาด ---
    // หมึกอยู่คนละชั้นกับเส้นบรรทัดของกระดาษ เพราะยางลบใช้ destination-out
    // ถ้าวาดรวมชั้นเดียว ยางลบจะลบเส้นบรรทัดติดไปด้วยจนกระดาษเป็นรูโหว่
    var ctx = cv.getContext('2d');
    var lay = document.createElement('canvas');
    var lctx = lay.getContext('2d');

    function fit(){
      var cw = cv.clientWidth || LW;
      var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      var k = (cw * dpr) / LW;
      cv.width = Math.round(LW * k);
      cv.height = Math.round(LH * k);
      cv.style.height = Math.round(cw * LH / LW) + 'px';
      lay.width = cv.width; lay.height = cv.height;
      ctx.setTransform(k, 0, 0, k, 0, 0);
      lctx.setTransform(k, 0, 0, k, 0, 0);
      render();
    }
    function grid(){
      ctx.save();
      ctx.strokeStyle = '#e4e7e2'; ctx.lineWidth = 1;
      for (var y = 45; y < LH; y += 45){
        ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(LW, y + .5); ctx.stroke();
      }
      ctx.restore();
    }
    function drawStroke(c, s){
      var p = s.p;
      if (!p || p.length < 3) return;
      c.save();
      c.lineCap = 'round'; c.lineJoin = 'round';
      if (s.e){ c.globalCompositeOperation = 'destination-out'; c.strokeStyle = 'rgba(0,0,0,1)'; }
      else c.strokeStyle = INKS[s.c] || INKS[0];
      // ลากทีละช่วงเพื่อให้ความหนาเปลี่ยนตามแรงกดของปากกาได้
      for (var i = 3; i < p.length; i += 3){
        var x0 = p[i-3], y0 = p[i-2], pr0 = p[i-1];
        var x1 = p[i],   y1 = p[i+1], pr1 = p[i+2];
        c.beginPath();
        c.lineWidth = s.w * (0.55 + 0.9 * ((pr0 + pr1) / 2));
        c.moveTo(x0, y0); c.lineTo(x1, y1);
        c.stroke();
      }
      c.restore();
    }
    function wipe(c, cw, ch){ c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cw, ch); c.restore(); }
    function render(){
      wipe(ctx, cv.width, cv.height);
      wipe(lctx, lay.width, lay.height);
      grid();
      strokes.forEach(function(s){ drawStroke(lctx, s); });
      if (cur) drawStroke(lctx, cur);
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(lay, 0, 0); ctx.restore();
    }

    function pt(ev){
      var r = cv.getBoundingClientRect();
      return [
        Math.round((ev.clientX - r.left) / r.width * LW * 10) / 10,
        Math.round((ev.clientY - r.top) / r.height * LH * 10) / 10,
        Math.round((ev.pressure > 0 ? ev.pressure : 0.5) * 100) / 100
      ];
    }
    function accept(ev){
      if (ev.pointerType === 'pen'){ penSeen = true; return true; }
      // กันฝ่ามือ — เมื่อเคยใช้ปากกาบนแผ่นนี้แล้ว ไม่ต้องรับสัมผัสจากนิ้วหรือฝ่ามืออีก
      if (ev.pointerType === 'touch') return !penSeen;
      return true;
    }
    cv.addEventListener('pointerdown', function(ev){
      if (!accept(ev) || ev.button > 0) return;
      ev.preventDefault();
      try { cv.setPointerCapture(ev.pointerId); } catch(e){}
      drawing = true;
      var p = pt(ev);
      cur = { c: ink, w: WIDTHS[wIdx] * (tool === 'era' ? 3 : 1), p: p.slice() };
      if (tool === 'era') cur.e = 1;
      cur.p.push(p[0], p[1], p[2]);      // จุดเดียวก็ให้เห็นเป็นจุด
      render();
    });
    cv.addEventListener('pointermove', function(ev){
      if (!drawing || !cur) return;
      ev.preventDefault();
      var evs = ev.getCoalescedEvents ? ev.getCoalescedEvents() : [ev];
      for (var i = 0; i < evs.length; i++){
        var p = pt(evs[i]);
        var n = cur.p.length;
        if (n >= 3 && Math.abs(p[0] - cur.p[n-3]) < 0.6 && Math.abs(p[1] - cur.p[n-2]) < 0.6) continue;
        cur.p.push(p[0], p[1], p[2]);
      }
      render();
    });
    function end(ev){
      if (!drawing) return;
      drawing = false;
      if (cur && cur.p.length >= 6) strokes.push(cur);
      cur = null;
      render(); commit();
    }
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);
    cv.addEventListener('pointerleave', function(ev){ if (drawing) end(ev); });

    bUndo.addEventListener('click', function(){ strokes.pop(); render(); commit(); });
    bClr.addEventListener('click', function(){
      if (strokes.length && !confirm('ล้างลายมือทั้งแผ่นนี้ ยืนยันหรือไม่')) return;
      strokes.length = 0; render(); commit();
    });
    bPng.addEventListener('click', function(){
      // แคนวาสมีพื้นหลังโปร่ง จึงต้องรองพื้นสีขาวก่อนเซฟ ไม่งั้นเปิดในโปรแกรมอื่นจะเป็นพื้นดำ
      var out = document.createElement('canvas');
      out.width = cv.width; out.height = cv.height;
      var o = out.getContext('2d');
      o.fillStyle = '#fdfdfb'; o.fillRect(0, 0, out.width, out.height);
      o.drawImage(cv, 0, 0);
      try {
        out.toBlob(function(bl){
          if (!bl) return;
          var u = URL.createObjectURL(bl), a = document.createElement('a');
          a.href = u; a.download = 'draw-' + COURSE + '-' + key.replace(/[^\w-]/g, '') + '.png';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function(){ URL.revokeObjectURL(u); }, 1000);
        });
      } catch(e){}
    });

    function commit(){
      if (strokes.length) draws[key] = { w: LW, h: LH, s: strokes };
      else delete draws[key];
      var ok = saveDraws();
      if (opts.onChange) opts.onChange(strokes.length > 0, ok);
    }

    if (window.ResizeObserver){
      var ro = new ResizeObserver(function(){ if (cv.clientWidth) fit(); });
      ro.observe(cv);
    } else {
      window.addEventListener('resize', function(){ fit(); });
    }

    return {
      el: wrap,
      fit: fit,
      isEmpty: function(){ return strokes.length === 0; },
      clear: function(){ strokes.length = 0; render(); commit(); }
    };
  }

  /* ---------- โน้ตประจำหัวข้อ ---------- */
  var secs = Array.prototype.slice.call(document.querySelectorAll('section.sec[id]'));
  var titleOf = {};

  secs.forEach(function(sec){
    var head = sec.querySelector('.sec-h');
    var h2 = sec.querySelector('h2');
    if (!head || !h2) return;
    var id = sec.id;
    titleOf[id] = h2.textContent.trim();

    var btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'nt-add';
    btn.setAttribute('aria-expanded', 'false');
    head.appendChild(btn);

    var box = document.createElement('div');
    box.className = 'nt-box'; box.hidden = true;

    var tabs = document.createElement('div'); tabs.className = 'nt-tabs';
    var tType = document.createElement('button'); tType.type = 'button'; tType.className = 'nt-tab';
    tType.setAttribute('aria-selected', 'true'); tType.textContent = 'พิมพ์';
    var tDraw = document.createElement('button'); tDraw.type = 'button'; tDraw.className = 'nt-tab';
    tDraw.setAttribute('aria-selected', 'false'); tDraw.textContent = 'เขียน';
    tabs.appendChild(tType); tabs.appendChild(tDraw);

    var paneT = document.createElement('div'); paneT.className = 'nt-pane';
    var ta = document.createElement('textarea');
    ta.placeholder = 'จดโน้ตของหัวข้อนี้... พิมพ์แล้วบันทึกให้เอง';
    ta.setAttribute('aria-label', 'โน้ตของหัวข้อ ' + titleOf[id]);
    paneT.appendChild(ta);

    var paneD = document.createElement('div'); paneD.className = 'nt-pane'; paneD.hidden = true;

    var foot = document.createElement('div'); foot.className = 'nt-foot';
    var hint = document.createElement('span'); hint.className = 'nt-hint';
    var del = document.createElement('button');
    del.type = 'button'; del.className = 'nt-del'; del.textContent = 'ลบโน้ตนี้';
    foot.appendChild(hint); foot.appendChild(del);

    box.appendChild(tabs); box.appendChild(paneT); box.appendChild(paneD); box.appendChild(foot);
    (sec.querySelector('.body') || sec).appendChild(box);

    var padObj = null;
    function ensurePad(){
      if (padObj) return padObj;
      padObj = makePad(id, 1200, 450, {
        label: 'พื้นที่เขียนด้วยมือของหัวข้อ ' + titleOf[id],
        onChange: function(has, ok){
          hint.textContent = ok ? 'บันทึกแล้ว'
            : (quotaHit ? 'พื้นที่เก็บเต็ม ลองกด “บันทึกรูป” เก็บไว้แล้วล้างของเก่า' : 'เบราว์เซอร์นี้เก็บข้อมูลไม่ได้');
          paint(); renderNotes();
        }
      });
      paneD.appendChild(padObj.el);
      requestAnimationFrame(function(){ padObj.fit(); });
      return padObj;
    }

    function hasType(){ return !!(notes[id] && notes[id].trim()); }
    function hasDraw(){ return !!(draws[id] && draws[id].s && draws[id].s.length); }
    function paint(){
      var has = hasType() || hasDraw();
      btn.dataset.has = has ? '1' : '0';
      btn.textContent = has ? 'โน้ต ✓' : '+ โน้ต';
      del.hidden = !has;
      tType.innerHTML = 'พิมพ์' + (hasType() ? '<span class="dot"></span>' : '');
      tDraw.innerHTML = 'เขียน' + (hasDraw() ? '<span class="dot"></span>' : '');
      paneT.classList.toggle('empty', !hasType());
      paneD.classList.toggle('empty', !hasDraw());
    }
    function show(which){
      var d = which === 'draw';
      tType.setAttribute('aria-selected', d ? 'false' : 'true');
      tDraw.setAttribute('aria-selected', d ? 'true' : 'false');
      paneT.hidden = d; paneD.hidden = !d;
      if (d){ ensurePad().fit(); } else { grow(); }
    }
    function open(s){
      box.hidden = !s;
      btn.setAttribute('aria-expanded', s ? 'true' : 'false');
      if (s){
        if (hasDraw() && !hasType()) show('draw'); else grow();
        if (hasDraw()) ensurePad().fit();
      }
    }
    function grow(){ ta.style.height = 'auto'; ta.style.height = Math.max(70, ta.scrollHeight) + 'px'; }

    ta.value = notes[id] || '';
    paint();
    if (hasType() || hasDraw()) open(true);

    btn.addEventListener('click', function(){ open(box.hidden); });
    tType.addEventListener('click', function(){ show('type'); });
    tDraw.addEventListener('click', function(){ show('draw'); });
    ta.addEventListener('input', function(){
      notes[id] = ta.value;
      if (!ta.value.trim()) delete notes[id];
      var ok = saveNotes();
      hint.textContent = ok ? 'บันทึกแล้ว' : 'เบราว์เซอร์นี้เก็บโน้ตไม่ได้ ลองคัดลอกเก็บไว้เอง';
      paint(); grow(); renderNotes();
    });
    del.addEventListener('click', function(){
      if (!confirm('ลบทั้งข้อความและลายมือของหัวข้อนี้ ยืนยันหรือไม่')) return;
      ta.value = ''; delete notes[id]; saveNotes();
      if (padObj) padObj.clear(); else { delete draws[id]; saveDraws(); }
      hint.textContent = ''; paint(); grow(); open(false); renderNotes();
    });
  });

  /* ---------- เครื่องคิดเลขของกระดาษทด ----------
     เขียน parser เองแทนการใช้ eval เพราะ eval รันโค้ดอะไรก็ได้ที่พิมพ์ลงไป */
  function tokenize(s){
    var out = [], i = 0;
    while (i < s.length){
      var c = s.charAt(i);
      if (/\s/.test(c)){ i++; continue; }
      if (/[0-9.,]/.test(c)){
        var num = '', dot = false;
        while (i < s.length && /[0-9.,]/.test(s.charAt(i))){
          var d = s.charAt(i);
          if (d === ','){ i++; continue; }
          if (d === '.'){ if (dot) break; dot = true; }
          num += d; i++;
        }
        if (num === '' || num === '.') return null;
        out.push(parseFloat(num));
        continue;
      }
      if ('+-*/×÷()%'.indexOf(c) >= 0){ out.push(c); i++; continue; }
      return null;
    }
    return out;
  }
  function calc(line){
    var s = String(line).replace(/[^0-9.,+\-*/×÷()%\s]/g, ' ');
    if (!/[+\-*/×÷]/.test(s) || !/\d/.test(s)) return null;
    var t = tokenize(s);
    if (!t) return null;
    var i = 0, bad = false;
    function eat(x){ if (t[i] === x){ i++; return true; } return false; }
    function primary(){
      if (eat('(')){ var v = expr(); if (!eat(')')) bad = true; return v; }
      if (typeof t[i] === 'number') return t[i++];
      bad = true; return 0;
    }
    function unary(){
      if (eat('-')) return -unary();
      if (eat('+')) return unary();
      var v = primary();
      while (eat('%')) v = v / 100;
      return v;
    }
    function term(){
      var v = unary();
      for(;;){
        if (eat('*') || eat('×')) v *= unary();
        else if (eat('/') || eat('÷')){ var d = unary(); if (d === 0){ bad = true; return 0; } v /= d; }
        else return v;
      }
    }
    function expr(){
      var v = term();
      for(;;){
        if (eat('+')) v += term();
        else if (eat('-')) v -= term();
        else return v;
      }
    }
    var out = expr();
    if (bad || i !== t.length || !isFinite(out)) return null;
    return out;
  }
  function money(n){
    var d = Math.abs(n % 1) > 1e-9 ? 2 : 0;
    return n.toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:Math.max(d, 2)});
  }

  /* ---------- แผงกระดาษทด ---------- */
  var fab = document.createElement('button');
  fab.type = 'button'; fab.className = 'pad-fab';
  fab.setAttribute('aria-label', 'เปิดกระดาษทดและโน้ต');
  fab.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>' +
    '<span>กระดาษทด</span>';
  document.body.appendChild(fab);

  var pad = null, padIn = null, padRes = null, padNotes = null, msgEl = null, padDraw = null;

  function anyNote(id){
    return (notes[id] && notes[id].trim()) || (draws[id] && draws[id].s && draws[id].s.length);
  }
  function markFab(){
    var n = secs.filter(function(s){ return anyNote(s.id); }).length;
    var dot = fab.querySelector('.pad-dot');
    if (n > 0 && !dot){ var d = document.createElement('span'); d.className = 'pad-dot'; fab.appendChild(d); }
    else if (n === 0 && dot) dot.remove();
  }

  function renderCalc(){
    if (!padRes) return;
    padRes.innerHTML = '';
    var lines = (padIn.value || '').split('\n'), sum = 0, hits = 0;
    lines.forEach(function(ln){
      var v = calc(ln);
      if (v === null) return;
      hits++; sum += v;
      var row = document.createElement('div'); row.className = 'pad-row';
      var a = document.createElement('span'); a.className = 'src'; a.textContent = ln.trim();
      var b = document.createElement('span'); b.className = 'val'; b.textContent = money(v);
      row.appendChild(a); row.appendChild(b); padRes.appendChild(row);
    });
    if (!hits){
      var e = document.createElement('div'); e.className = 'pad-empty';
      e.innerHTML = 'พิมพ์บรรทัดที่มีการคำนวณ แล้วผลลัพธ์จะขึ้นตรงนี้เอง<br>' +
        'เช่น <code>60% * 100,000</code> · <code>80,000 / 10</code> · <code>(500,000 + 80,000) * 40%</code><br>' +
        'พิมพ์คำอธิบายไทยปนได้ เช่น <code>ค่าตัดจำหน่าย 80,000 / 10 ปี</code><br><br>' +
        'ขึ้นต้นบรรทัดด้วย <code>+</code> หรือ <code>-</code> เพื่อไล่ยอดแบบคอลัมน์บัญชี ' +
        'แล้วดูผลรวมท้ายรายการ เช่น<br><code>+ ส่วนแบ่งกำไร 60% * 50,000</code><br>' +
        '<code>- ตัดจำหน่าย 60% * 8,000</code><br><code>- ปันผล 60% * 40,000</code><br><br>' +
        'ถ้าอยากทดด้วยลายมือ กดแท็บ <b>เขียน</b> ด้านบน';
      padRes.appendChild(e);
    } else if (hits > 1){
      var s = document.createElement('div'); s.className = 'pad-row sum';
      var sa = document.createElement('span'); sa.className = 'src'; sa.textContent = 'ผลรวมทุกบรรทัด (' + hits + ' บรรทัด)';
      var sb = document.createElement('span'); sb.className = 'val'; sb.textContent = money(sum);
      s.appendChild(sa); s.appendChild(sb); padRes.appendChild(s);
    }
  }

  function renderNotes(){
    markFab();
    if (!padNotes) return;
    padNotes.innerHTML = '';
    var ids = secs.map(function(s){ return s.id; }).filter(anyNote);
    if (!ids.length){
      var e = document.createElement('div'); e.className = 'pad-empty';
      e.textContent = 'ยังไม่มีโน้ต — กดปุ่ม “+ โน้ต” ที่หัวข้อไหนก็ได้เพื่อเริ่มจดหรือเขียน';
      padNotes.appendChild(e); return;
    }
    ids.forEach(function(id){
      var wrap = document.createElement('div'); wrap.className = 'pad-note';
      var a = document.createElement('a'); a.href = '#' + id; a.textContent = titleOf[id] || id;
      a.addEventListener('click', function(ev){ ev.preventDefault(); goTo(id); });
      wrap.appendChild(a);
      if (notes[id] && notes[id].trim()){
        var p = document.createElement('p'); p.textContent = notes[id]; wrap.appendChild(p);
      }
      if (draws[id] && draws[id].s && draws[id].s.length){
        var t = document.createElement('div'); t.className = 'tagdraw';
        t.textContent = '✎ มีลายมือเขียนไว้ ' + draws[id].s.length + ' เส้น';
        wrap.appendChild(t);
      }
      padNotes.appendChild(wrap);
    });
  }

  function goTo(id){
    var sec = document.getElementById(id);
    if (!sec) return;
    var panel = sec.closest('[role="tabpanel"]');
    if (panel && panel.classList.contains('hidden')){
      var tab = document.querySelector('.tab[aria-controls="' + panel.id + '"]');
      if (tab) tab.click();
    }
    close();
    setTimeout(function(){ sec.scrollIntoView({block:'start'}); }, 60);
  }

  function allText(){
    var out = ['โน้ตวิชา ' + COURSE + ' — ' + new Date().toLocaleString('th-TH'), ''];
    secs.forEach(function(s){
      var has = false, buf = ['## ' + (titleOf[s.id] || s.id)];
      if (notes[s.id] && notes[s.id].trim()){ buf.push(notes[s.id].trim()); has = true; }
      if (draws[s.id] && draws[s.id].s && draws[s.id].s.length){
        buf.push('[มีลายมือเขียนไว้ ' + draws[s.id].s.length + ' เส้น — ลายมือไม่ติดมากับไฟล์ .txt ให้กด “บันทึกรูป” ที่แผ่นนั้นแทน]');
        has = true;
      }
      if (has){ out = out.concat(buf, ['']); }
    });
    var pd = get(K_PAD, '');
    if (pd.trim()){ out.push('## กระดาษทด'); out.push(pd.trim()); }
    return out.join('\n');
  }

  function flash(t){ if (msgEl){ msgEl.textContent = t; setTimeout(function(){ if (msgEl) msgEl.textContent = ''; }, 3000); } }
  function onEsc(e){ if (e.key === 'Escape' && pad) close(); }
  function close(){
    if (!pad) return;
    document.removeEventListener('keydown', onEsc);
    pad.remove(); pad = null; padIn = null; padRes = null; padNotes = null; msgEl = null; padDraw = null;
    fab.style.display = ''; markFab();
  }

  function open(){
    if (pad) return;
    pad = document.createElement('div');
    pad.className = 'pad';
    pad.setAttribute('role', 'dialog');
    pad.setAttribute('aria-label', 'กระดาษทดและโน้ต');
    pad.innerHTML =
      '<div class="pad-head"><div class="pad-tabs">' +
        '<button type="button" class="pad-tab" data-p="calc" aria-selected="true">พิมพ์ทด</button>' +
        '<button type="button" class="pad-tab" data-p="draw" aria-selected="false">เขียน</button>' +
        '<button type="button" class="pad-tab" data-p="notes" aria-selected="false">โน้ตทั้งหมด</button>' +
      '</div><button type="button" class="pad-x" aria-label="ปิด">&times;</button></div>' +
      '<div class="pad-body" data-p="calc">' +
        '<textarea class="pad-in" spellcheck="false" aria-label="กระดาษทด" ' +
        'placeholder="ทดเลขตรงนี้ได้เลย พิมพ์บรรทัดละรายการ&#10;เช่น  60% * 100,000&#10;      80,000 / 10"></textarea>' +
        '<div class="pad-res"></div>' +
      '</div>' +
      '<div class="pad-body" data-p="draw" hidden></div>' +
      '<div class="pad-body" data-p="notes" hidden></div>' +
      '<div class="pad-foot">' +
        '<button type="button" class="pad-act" data-a="copy">คัดลอกทั้งหมด</button>' +
        '<button type="button" class="pad-act" data-a="save">ดาวน์โหลด .txt</button>' +
        '<button type="button" class="pad-act" data-a="print">พิมพ์พร้อมโน้ต</button>' +
        '<button type="button" class="pad-act danger" data-a="clear">ล้างทั้งหมด</button>' +
        '<span class="pad-msg"></span>' +
      '</div>';
    document.body.appendChild(pad);
    fab.style.display = 'none';

    padIn = pad.querySelector('.pad-in');
    padRes = pad.querySelector('.pad-res');
    padNotes = pad.querySelector('.pad-body[data-p="notes"]');
    msgEl = pad.querySelector('.pad-msg');

    padIn.value = get(K_PAD, '');
    renderCalc(); renderNotes();
    if (!canStore) flash('เบราว์เซอร์นี้เก็บข้อมูลไม่ได้');

    padIn.addEventListener('input', function(){ set(K_PAD, padIn.value); renderCalc(); });

    Array.prototype.forEach.call(pad.querySelectorAll('.pad-tab'), function(t){
      t.addEventListener('click', function(){
        var p = t.dataset.p;
        Array.prototype.forEach.call(pad.querySelectorAll('.pad-tab'), function(x){
          x.setAttribute('aria-selected', x.dataset.p === p ? 'true' : 'false');
        });
        Array.prototype.forEach.call(pad.querySelectorAll('.pad-body'), function(x){ x.hidden = x.dataset.p !== p; });
        pad.classList.toggle('wide', p === 'draw');     // แผ่นเขียนต้องการที่กว้างกว่า
        if (p === 'draw'){
          if (!padDraw){
            padDraw = makePad('__pad', 1200, 900, {
              label: 'กระดาษทดแบบเขียนด้วยมือ',
              onChange: function(has, ok){
                if (!ok) flash(quotaHit ? 'พื้นที่เก็บเต็ม กด “บันทึกรูป” เก็บไว้แล้วล้าง' : 'เก็บไม่ได้');
              }
            });
            pad.querySelector('.pad-body[data-p="draw"]').appendChild(padDraw.el);
          }
          requestAnimationFrame(function(){ padDraw.fit(); });
        }
      });
    });

    pad.querySelector('.pad-x').addEventListener('click', close);
    pad.addEventListener('click', function(ev){
      var b = ev.target.closest('.pad-act');
      if (!b) return;
      var a = b.dataset.a;
      if (a === 'copy'){
        var txt = allText();
        if (navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(txt).then(function(){ flash('คัดลอกแล้ว'); }, function(){ flash('คัดลอกไม่สำเร็จ'); });
        } else flash('เบราว์เซอร์นี้คัดลอกให้ไม่ได้');
      } else if (a === 'save'){
        try {
          var blob = new Blob([allText()], {type:'text/plain;charset=utf-8'});
          var url = URL.createObjectURL(blob), link = document.createElement('a');
          link.href = url; link.download = 'notes-' + COURSE + '.txt';
          document.body.appendChild(link); link.click(); link.remove();
          setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
          flash('ดาวน์โหลดแล้ว · ลายมือไม่ติดมาในไฟล์นี้');
        } catch(e){ flash('ดาวน์โหลดไม่ได้ในหน้านี้'); }
      } else if (a === 'print'){
        close(); setTimeout(function(){ window.print(); }, 150);
      } else if (a === 'clear'){
        if (!confirm('ลบโน้ต ลายมือ และกระดาษทดของวิชานี้ทั้งหมด ยืนยันหรือไม่')) return;
        notes = {}; draws = {}; saveNotes(); saveDraws(); set(K_PAD, '');
        padIn.value = ''; renderCalc();
        location.reload();
        return;
      }
    });

    document.addEventListener('keydown', onEsc);
    padIn.focus();
  }

  fab.addEventListener('click', open);
  markFab();
})();
</script>
