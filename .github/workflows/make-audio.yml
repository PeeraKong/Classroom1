name: สร้างไฟล์เสียงบรรยาย

# กดรันเองจากหน้าเว็บ GitHub เท่านั้น ไม่รันอัตโนมัติตอน push
# เพราะการสร้างเสียงใช้เวลาหลายนาทีและไม่จำเป็นต้องทำทุกครั้งที่แก้โค้ด
on:
  workflow_dispatch:
    inputs:
      courses:
        description: 'วิชาที่จะสร้าง เว้นว่างคือทุกวิชา เช่น audit หรือ audit marketing'
        required: false
        default: ''
      voice:
        description: 'เสียงที่ใช้'
        required: false
        default: 'male'
        type: choice
        options: [male, female]
      force:
        description: 'สร้างใหม่ทั้งหมดแม้บทบรรยายไม่เปลี่ยน'
        required: false
        default: false
        type: boolean
      en_voice:
        description: 'เสียงที่ใช้อ่านช่วงภาษาอังกฤษ · off คือให้เสียงไทยอ่านทั้งหมดแบบเดิม'
        required: false
        default: 'us-male'
        type: choice
        options: [us-male, us-male2, uk-male, us-female, uk-female, off]
      task:
        description: 'audio คือสร้างไฟล์เสียงจริง · sample คือทำคลิปสั้นไว้เทียบเสียงก่อน'
        required: false
        default: 'audio'
        type: choice
        options: [audio, sample, listening]

permissions:
  contents: write

concurrency:
  # กันไม่ให้รันซ้อนกันจนแย่งกัน commit ไฟล์เดียวกัน
  group: make-audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: ดึงโค้ดของสาขานี้
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: ติดตั้ง Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ติดตั้ง edge-tts
        run: python -m pip install --quiet --upgrade edge-tts

      - name: ทำคลิปตัวอย่างไว้เทียบเสียง
        if: inputs.task == 'sample'
        run: python tools/sample-voices.py

      - name: สร้างไฟล์เสียงแบบฝึกฟัง
        if: inputs.task == 'listening'
        run: |
          python tools/make-listening.py --check
          python tools/make-listening.py
          python tools/make-listening.py --check

      - name: ดูว่าบทไหนยังขาดไฟล์เสียง
        if: inputs.task == 'audio'
        # ส่งค่าที่ผู้ใช้กรอกผ่าน env ไม่แทรกลงคำสั่งตรง ๆ กันการแทรกคำสั่งเชลล์
        # ตั้งใจไม่ใส่เครื่องหมายคำพูดรอบ $COURSES เพราะต้องการให้แยกเป็นหลายอาร์กิวเมนต์
        env:
          COURSES: ${{ inputs.courses }}
          EN_VOICE: ${{ inputs.en_voice }}
        run: python tools/make-audio.py $COURSES --en-voice "$EN_VOICE" --check

      - name: สร้างไฟล์เสียง
        if: inputs.task == 'audio'
        env:
          COURSES: ${{ inputs.courses }}
          VOICE: ${{ inputs.voice }}
          FORCE: ${{ inputs.force }}
          EN_VOICE: ${{ inputs.en_voice }}
        run: |
          ARGS=""
          if [ "$FORCE" = "true" ]; then ARGS="--force"; fi
          python tools/make-audio.py $COURSES --voice "$VOICE" --en-voice "$EN_VOICE" $ARGS

      - name: ตรวจซ้ำว่าครบแล้ว
        if: inputs.task == 'audio'
        env:
          COURSES: ${{ inputs.courses }}
          EN_VOICE: ${{ inputs.en_voice }}
        run: python tools/make-audio.py $COURSES --en-voice "$EN_VOICE" --check

      - name: เก็บไฟล์เสียงเข้า git
        env:
          VOICE: ${{ inputs.voice }}
          EN_VOICE: ${{ inputs.en_voice }}
          BRANCH: ${{ github.ref_name }}
          SUBJECT: ${{ inputs.task == 'sample' && 'เพิ่มคลิปตัวอย่างไว้เทียบเสียงอ่านภาษาอังกฤษ' || inputs.task == 'listening' && 'เพิ่มไฟล์เสียงแบบฝึกฟัง Part III' || format('เพิ่มไฟล์เสียงบรรยายด้วยเสียง {0}', inputs.voice) }}
        run: |
          # ต้องใช้ status --porcelain ไม่ใช่ diff --quiet
          # เพราะ diff มองเฉพาะไฟล์ที่ git ติดตามอยู่แล้ว ไฟล์ใหม่ทั้งโฟลเดอร์
          # อย่าง samples/ จะไม่ถูกนับ ทำให้ข้ามการ commit ไปเงียบ ๆ
          if [ -z "$(git status --porcelain)" ]; then
            echo "ไม่มีอะไรเปลี่ยน ทุกบทมีไฟล์เสียงอยู่แล้ว"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$SUBJECT" \
                     -m "สร้างโดย GitHub Actions · ช่วงภาษาอังกฤษใช้เสียง $EN_VOICE"
          # ถ้ามีคน push แทรกระหว่างที่รันอยู่ ให้ rebase ทับแล้วค่อยส่ง
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"
