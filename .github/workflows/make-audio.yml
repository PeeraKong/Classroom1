name: สร้างไฟล์เสียงบรรยาย

# กดรันเองจากหน้าเว็บ GitHub เท่านั้น ไม่รันอัตโนมัติตอน push
# เพราะการสร้างเสียงใช้เวลาหลายนาทีและไม่จำเป็นต้องทำทุกครั้งที่แก้โค้ด
on:
  workflow_dispatch:
    inputs:
      courses:
        description: 'วิชาที่จะสร้าง เว้นว่างคือทุกวิชา เช่น audit หรือ audit marketing'
        required: false
        default: ''
      voice:
        description: 'เสียงที่ใช้'
        required: false
        default: 'male'
        type: choice
        options: [male, female]
      force:
        description: 'สร้างใหม่ทั้งหมดแม้บทบรรยายไม่เปลี่ยน'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  # กันไม่ให้รันซ้อนกันจนแย่งกัน commit ไฟล์เดียวกัน
  group: make-audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: ดึงโค้ดของสาขานี้
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: ติดตั้ง Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ติดตั้ง edge-tts
        run: python -m pip install --quiet --upgrade edge-tts

      - name: ดูว่าบทไหนยังขาดไฟล์เสียง
        run: python tools/make-audio.py ${{ inputs.courses }} --check

      - name: สร้างไฟล์เสียง
        run: |
          python tools/make-audio.py ${{ inputs.courses }} \
            --voice "${{ inputs.voice }}" \
            ${{ inputs.force && '--force' || '' }}

      - name: ตรวจซ้ำว่าครบแล้ว
        run: python tools/make-audio.py ${{ inputs.courses }} --check

      - name: เก็บไฟล์เสียงเข้า git
        run: |
          if git diff --quiet; then
            echo "ไม่มีอะไรเปลี่ยน ทุกบทมีไฟล์เสียงอยู่แล้ว"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "เพิ่มไฟล์เสียงบรรยายด้วยเสียง ${{ inputs.voice }}

          สร้างโดย GitHub Actions จาก tools/make-audio.py"
          # ถ้ามีคน push แทรกระหว่างที่รันอยู่ ให้ rebase ทับแล้วค่อยส่ง
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
